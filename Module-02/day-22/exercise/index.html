    <title>Currency Exchange</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
</head>

<body class="light" id="body">

    <header>
        <button id="theme-set">Toggle Theme</button>
        <div>
            <h1 class="brand-title">Birr Watch</h1>
            <h2 class="subtitle">Convert to ETB</h2>

        </div>

    </header>


    <main>
        <section id="converter-card">

        </section>
        <form id="exchange-form">
            <div class="form-group">
                <label for="amt">Amount(ETB)</label>
                <input type="number" name="amount" id="amt" class="input-field" placeholder="Enter amount...">
            </div>

            <div class="form-group">
                <label for="currency-rates">Target Currency</label>
                <select id="currency-rates" class="select-field"></select>
            </div>


            <button type="submit" class="primary-btn">Convert Now</button>
        </form>


        <section id="result-container"></section>

        <section id="watch-list-section">
            <h3>Saved Watch List</h3>
            <div id="watch-list" class="watchlist-container"></div>
        </section>

    </main>

    <footer>

    </footer>
