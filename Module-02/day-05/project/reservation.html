<!DOCTYPE html>
<html lang="en">

<!-- proj requirement -->
<!-- hero , about section , responsive menu , reservation menu , footer - location and contact   -->


<head>
    <meta charset="UTF-8">
    <!-- will make sure our website uses the devices actual width -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habesha Eatery Final</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&family=Edu+VIC+WA+NT+Hand:wght@400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Playwrite+NZ+Guides&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <!-- make the header sticky -->
        <!-- logo on the left , links right -->
        <name>
            <picture id="pic-container">
                <img id="logo-pic" src="../images/logo.png" alt="restaurant-logo">
            </picture>


            <p id="name">Royal Bistro</p>

        </name>




        <nav>
            <button class="nav-link">
                <a href="./index.html">Home</a>

            </button>
            <button class="nav-link">
                <a href="./menu.html">Menu</a>

            </button>
            <button class="nav-link">
                <a href="./reservation.html">Reservation</a>

            </button>
            <button class="nav-link">
                <a href="./contact.html">Contact</a>

            </button>
        </nav>

    </header>

    <main id="reservation-section">
        <h2 class="h2-in-section edu-vic-wa-nt-hand">Table Reservation</h2>
        <form action="#" method="POST">
            <div class="form-entries">
                <label for="name" class="playwrite-nz-guides-regular">Full name</label>
                <input id="name" name="name" type="text" required placeholder="Abebe Bikila">
            </div>

            <div class="form-entries">
                <label for="email" class="playwrite-nz-guides-regular">Email</label>
                <input id="email" name="email" type="email" required placeholder="example@domain.com">
            </div>

            <div class="form-entries">
                <label for="tel" class="playwrite-nz-guides-regular">Phone number (09xxxxxxxx)</label>
                <input id="tel" name="tel" type="tel" pattern="09[0-9]{8}" required placeholder="0912345678"
                    title="Must be a valid 10-digit Ethiopian number starting with 09">
            </div>

            <div class="form-entries">
                <label for="date" class="playwrite-nz-guides-regular">Reservation Date</label>
                <input id="date" name="date" type="date" required>
            </div>

            <div class="form-entries">
                <label for="party-size" class="playwrite-nz-guides-regular">Party Size (1–20)</label>
                <input id="party-size" name="party-size" type="number" min="1" max="20" required placeholder="2">
            </div>

            <div class="form-entries">
                <label for="special-request" class="playwrite-nz-guides-regular">Special Request</label>
                <textarea id="special-request" name="special-request" rows="3"></textarea>
            </div>

            <button type="submit" id="submit-button" class="nav-link">Submit Reservation</button>
        </form>
    </main>

    <footer>
        <!-- address , phone , hours -->

    </footer>

</body>

</html>
