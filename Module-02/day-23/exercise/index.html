<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Ordering Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="./style.css" rel="stylesheet">
    <script src="./script.js" defer></script>
</head>

<body>
    <header id="header">
        <section id="search-bar-container">
            <form id="search-form">
                <input id="search-bar" type="text" placeholder="🔍 Search menu items...">
            </form>
        </section>
    </header>

    <main id="main-section">
        <!-- Left Column: Menu Items -->
        <section id="menu-box">
            <h2>Our Menu</h2>
            <section id="menu-container">
                <!-- Dynamically generated menu items appear here -->
            </section>
        </section>

        <!-- Right Column: Cart & Checkout -->
        <div class="sidebar-wrapper">
            <section id="order-container-box">
                <h3>Your Order</h3>
                <div id="cart-items-wrapper">
                    <!-- Dynamic cart items appear here -->
                </div>
                <div id="total-container"></div>
            </section>

            <section id="checkout-form-container">
                <h3>Checkout Details</h3>
                <form id="checkout-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input id="name" name="name" placeholder="Abebe Kebede">
                        <div id="name-error" class="error-container"></div>
                    </div>

                    <div class="form-group">
                        <label for="phoneNum">Phone Number</label>
                        <input id="phoneNum" name="telNum" placeholder="+251 912 345 678">
                        <div id="phone-error" class="error-container"></div>
                    </div>

                    <div class="checkbox-group">
                        <input id="confirm-payment" type="checkbox" name="confirmPayment">
                        <label for="confirm-payment">Confirm Payment</label>
                    </div>

                    <div id="total-container-for-checkout-form"></div>

                    <button type="submit" id="checkout-button">Check Out</button>
                </form>
            </section>
        </div>
    </main>

    <footer></footer>
</body>

</html>
