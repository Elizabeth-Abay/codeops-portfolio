<!DOCTYPE html>
<html lang="en">

<!-- proj requirement -->
<!-- hero , about section , responsive menu , reservation menu , footer - location and contact   -->


<head>
    <meta charset="UTF-8">
    <!-- will make sure our website uses the devices actual width -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habesha Eatery Final</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&family=Edu+VIC+WA+NT+Hand:wght@400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Playwrite+NZ+Guides&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <!-- make the header sticky -->
        <!-- logo on the left , links right -->
        <name>
            <picture id="pic-container">
                <img id="logo-pic" src="../images/logo.png" alt="restaurant-logo">
            </picture>


            <p id="name">Royal Bistro</p>

        </name>




        <nav>
            <button class="nav-link">
                <a href="./index.html">Home</a>

            </button>
            <button class="nav-link">
                <a href="./menu.html">Menu</a>

            </button>
            <button class="nav-link">
                <a href="./reservation.html">Reservation</a>

            </button>
            <button class="nav-link">
                <a href="./contact.html">Contact</a>

            </button>
        </nav>

    </header>

    <main id="feed-back">
        <h2>Customer Feedback</h2>
        <form action="#" method="POST" id="feed-back-form">
            <div class="form-entry">
                <label for="reviewer-name">Your Name</label>
                <input type="text" id="reviewer-name" name="reviewer-name" placeholder="Enter your name" required>
            </div>

            <div class="form-entry">
                <label>Overall Experience</label>
                <div class="radio-group">
                    <label><input type="radio" name="rating" value="excellent" required> Excellent</label>
                    <label><input type="radio" name="rating" value="good"> Good</label>
                    <label><input type="radio" name="rating" value="average"> Average</label>
                </div>
            </div>

            <div class="form-entry">
                <label for="comments">Comments & Suggestions</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Tell us about your experience..."
                    required></textarea>
            </div>

            <button type="submit" id="feedback-submit">Submit Feedback</button>
        </form>
    </main>

    <footer>
        <!-- address , phone , hours -->

    </footer>

</body>

</html>
